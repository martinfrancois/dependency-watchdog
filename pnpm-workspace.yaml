# 10080 minutes = 7 days, the same cooldown as minimumReleaseAge in renovate.json. Renovate
# does not apply its own setting to lockFileMaintenance, because it hands lockfile regeneration
# to pnpm, so pnpm enforces the seven days itself on every resolution path.
minimumReleaseAge: 10080

# false refuses a version whose registry entry has no publish time instead of letting it past
# the cooldown. It is the counterpart of minimumReleaseAgeBehaviour "timestamp-required" in
# renovate.json.
minimumReleaseAgeIgnoreMissingTime: false

# Keeps pnpm-lock.yaml a single YAML document. Without this, pnpm 12 and later start the lockfile
# with a document that pins only pnpm itself, GitHub's dependency graph reads only that first
# document, and Dependabot stops seeing every npm package. Remove this line once
# https://github.com/dependabot/dependabot-core/issues/15904 is fixed and the dependency graph lists
# the packages from the second document. The cost: pnpm no longer switches itself to the
# packageManager version in package.json. CI installs that version with pnpm/action-setup, and
# locally Corepack or mise has to provide it.
pmOnFail: ignore
